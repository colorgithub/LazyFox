<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>Browser Test Page One</title>
		<style>
			body {
				font-family: Arial, sans-serif;
				padding: 20px;
			}
			.box {
				margin: 10px 0;
				padding: 10px;
				border: 1px solid #ccc;
			}
			#submenu,
			#successPanel,
			#doubleResult,
			#resultPanel,
			#blurTip,
			#selectResult,
			#uploadResult {
				display: none;
			}
			#loading {
				display: block;
				color: orange;
			}
			#hiddenTarget {
				display: none;
			}
		</style>
	</head>
	<body>
		<h1 id="app">App Ready</h1>

		<div class="box">
			<a id="toPage2" href="./browser_test_page2.html">Go Page 2</a>
		</div>

		<div class="box">
			<button id="submit">Submit</button>
			<div id="successPanel">Success Ready</div>
		</div>

		<div class="box">
			<button id="doubleButton">Double</button>
			<div id="doubleResult">Double Clicked</div>
		</div>

		<div class="box">
			<div id="menuArea">Hover Here</div>
			<div id="submenu">Sub Menu Open</div>
		</div>

		<div class="box">
			<input id="email" value="" />
			<div id="emailEcho"></div>
		</div>

		<div class="box">
			<input id="typeInput" value="" />
			<div id="typeEcho"></div>
		</div>

		<div class="box">
			<input id="searchInput" value="" />
			<div id="resultPanel">Search Result Ready</div>
		</div>

		<div class="box">
			<input id="blurInput" value="" />
			<div id="blurTip">Blur OK</div>
		</div>

		<div class="box">
			<input id="agree" type="checkbox" />
			<div id="agreeResult"></div>
		</div>

		<div class="box">
			<select id="country">
				<option value="">Please Select</option>
				<option value="CN">China</option>
				<option value="US">USA</option>
			</select>
			<div id="selectResult">Select Done</div>
		</div>

		<div class="box">
			<input id="fileInput" type="file" />
			<div id="uploadResult">Upload Done</div>
			<div id="uploadName"></div>
		</div>

		<div class="box">
			<button id="hideLoading">Hide Loading</button>
			<div id="loading">Loading...</div>
		</div>

		<div class="box">
			<button id="addItems">Add Items</button>
			<div class="item">Item A</div>
			<div class="item">Item B</div>
			<div id="itemArea"></div>
		</div>

		<div class="box">
			<div id="removeMe">Remove Me</div>
		</div>

		<div class="box">
			<button id="disabledButton" disabled>Disabled</button>
		</div>

		<div class="box">
			<button id="showHiddenButton">Show Hidden</button>
			<div id="hiddenTarget">Hidden Target Ready</div>
		</div>

		<div style="height: 1200px"></div>
		<div id="bottomArea">Bottom Area</div>

		<script>
			let submitCount = 0;

			document.getElementById("submit").addEventListener("click", function () {
				submitCount += 1;
				if (submitCount >= 2) {
					document.getElementById("successPanel").style.display = "block";
				}
			});

			document.getElementById("doubleButton").addEventListener("dblclick", function () {
				document.getElementById("doubleResult").style.display = "block";
			});

			document.getElementById("menuArea").addEventListener("mouseenter", function () {
				document.getElementById("submenu").style.display = "block";
			});

			document.getElementById("email").addEventListener("input", function (e) {
				document.getElementById("emailEcho").textContent = e.target.value;
			});

			document.getElementById("typeInput").addEventListener("input", function (e) {
				document.getElementById("typeEcho").textContent = e.target.value;
			});

			document.getElementById("searchInput").addEventListener("keydown", function (e) {
				if (e.key === "Enter") {
					document.getElementById("resultPanel").style.display = "block";
				}
			});

			document.getElementById("blurInput").addEventListener("blur", function () {
				document.getElementById("blurTip").style.display = "block";
			});

			document.getElementById("agree").addEventListener("change", function (e) {
				document.getElementById("agreeResult").textContent = e.target.checked ? "checked" : "unchecked";
			});

			document.getElementById("country").addEventListener("change", function () {
				document.getElementById("selectResult").style.display = "block";
			});

			document.getElementById("fileInput").addEventListener("change", function (e) {
				const file = e.target.files[0];
				if (file) {
					document.getElementById("uploadResult").style.display = "block";
					document.getElementById("uploadName").textContent = file.name;
				}
			});

			document.getElementById("hideLoading").addEventListener("click", function () {
				document.getElementById("loading").style.display = "none";
			});

			document.getElementById("addItems").addEventListener("click", function () {
				const area = document.getElementById("itemArea");

				const one = document.createElement("div");
				one.className = "item";
				one.textContent = "Item C";
				area.appendChild(one);

				const two = document.createElement("div");
				two.className = "item";
				two.textContent = "Item D";
				area.appendChild(two);
			});

			document.getElementById("showHiddenButton").addEventListener("click", function () {
				document.getElementById("hiddenTarget").style.display = "block";
			});
		</script>
	</body>
</html>
